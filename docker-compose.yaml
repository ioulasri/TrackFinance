version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: financetracking-db
    environment:
      POSTGRES_DB: trackfinance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trackfinance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trackfinance-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.dockerfile
    container_name: financetracking-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/trackfinance
      SECRET_KEY: dev-secret-key-change-in-production
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Ensure uvicorn uses the correct path based on your WORKDIR
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - trackfinance-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.dockerfile
    container_name: financetracking-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - trackfinance-network

volumes:
  postgres_data:

networks:
  trackfinance-network:
    driver: bridge
