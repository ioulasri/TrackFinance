# DigitalOcean App Platform Configuration
# Place this file in the root of your repository

name: trackfinance
region: nyc

# Database
databases:
  - name: trackfinance-db
    engine: PG
    version: "15"
    production: false
    size: basic-xs

# Backend API
services:
  - name: backend
    github:
      repo: ioulasri/TrackFinance
      branch: develop
      deploy_on_push: true
    source_dir: /backend
    dockerfile_path: docker/backend.dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: bash post_deploy.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000
    routes:
      - path: /api
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${trackfinance-db.DATABASE_URL}
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: j1XXclRls0CMqvPtueDbKIFd1UE0pJ_rC9AtakiKOcg
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: API_HOST
        scope: RUN_TIME
        value: "0.0.0.0"
      - key: API_PORT
        scope: RUN_TIME
        value: "8000"
    health_check:
      http_path: /
      initial_delay_seconds: 30

# Frontend
static_sites:
  - name: frontend
    github:
      repo: ioulasri/TrackFinance
      branch: develop
      deploy_on_push: true
    source_dir: /frontend
    build_command: npm install && npm run build
    output_dir: dist
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}
